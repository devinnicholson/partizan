[build-system]
requires = ["maturin>=1.9.3,<2"]
build-backend = "maturin"

[project]
name = "partizan-cgt"
version = "0.1.0"
description = "Bounded exact short-game and constrained-chess research tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Devin Nicholson" }]
keywords = [
  "chess",
  "combinatorial game theory",
  "canonical form",
  "exact verification",
  "research",
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/devinnicholson/partizan"
Repository = "https://github.com/devinnicholson/partizan"
Issues = "https://github.com/devinnicholson/partizan/issues"

[project.optional-dependencies]
neural = ["numpy>=1.26,<3"]

[project.scripts]
partizan = "partizan.fixed_value_cli:main"
partizan-events = "partizan.cli:main"
partizan-discovery = "partizan.discovery_cli:main"
partizan-digraph-ranker = "partizan.digraph_neural_ranker:main"
partizan-digraph-diversity-ranker = "partizan.digraph_diversity_ranker:main"

[tool.maturin]
manifest-path = "engine/Cargo.toml"
python-source = "python"
module-name = "partizan._native"
bindings = "pyo3"
features = ["extension-module"]
include = [
  { path = "CHANGELOG.md", format = "sdist" },
  { path = "CITATION.cff", format = "sdist" },
  { path = "CONTRIBUTING.md", format = "sdist" },
  { path = "docs/bounded_short_game.md", format = "sdist" },
  { path = "docs/development.md", format = "sdist" },
  { path = "docs/release_blockers.md", format = "sdist" },
  { path = "examples/bounded_short_game.py", format = "sdist" },
  { path = "tests/test_bounded_short_game.py", format = "sdist" },
  { path = "tests/test_semantic_canonical_form.py", format = "sdist" },
]
