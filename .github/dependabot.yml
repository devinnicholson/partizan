version: 2
updates:
  - package-ecosystem: cargo
    directory: /engine
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust"]
  - package-ecosystem: cargo
    directory: /engine/gate_s_checker
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust", "gate-s"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
  - package-ecosystem: npm
    directory: /visualizer
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "visualizer"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
