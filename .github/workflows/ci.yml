name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visualizer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visualizer
    steps:
      # actions/checkout v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: visualizer/package-lock.json
      - name: Install visualizer
        run: npm ci
      - name: Visualizer tests
        run: npm test
      - name: Visualizer lint
        run: npm run lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10"]
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Checkout frozen Bitmesh candidate
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: devinnicholson/bitmesh
          ref: 961a918c16cda757322aca66e3a368cf95438cad
          path: _upstreams/bitmesh
          persist-credentials: false
      - name: Checkout frozen Thermograph candidate
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: devinnicholson/thermograph
          ref: bdf535c7a40ce76c4d1dbfb88d8c522eb034b8bd
          path: _upstreams/thermograph
          persist-credentials: false
      - name: Checkout frozen Astralbase candidate
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: devinnicholson/astralbase
          ref: 81c7c583ee5b3cdd4c7e3a6d543e77803313bc54
          path: _upstreams/astralbase
          persist-credentials: false
      # actions/setup-python v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.88"
          components: clippy,rustfmt
      - name: Configure external release-candidate patches
        shell: python
        run: |
          import os
          from pathlib import Path
          root = Path.cwd()
          cargo_home = Path(os.environ.get("CARGO_HOME", Path.home() / ".cargo"))
          cargo_home.mkdir(parents=True, exist_ok=True)
          paths = {
              name: (root / "_upstreams" / name).resolve().as_posix()
              for name in ("bitmesh", "thermograph", "astralbase")
          }
          config = "[patch.\"crates-io\"]\n" + "".join(
              f'{name} = {{ path = "{path}" }}\n' for name, path in paths.items()
          )
          (cargo_home / "config.toml").write_text(config, encoding="utf-8")
      - name: Rust format
        run: cargo fmt --manifest-path engine/Cargo.toml --all -- --check
      - name: Rust tests
        run: cargo test --manifest-path engine/Cargo.toml --locked --all-targets
      - name: Strict Clippy
        run: cargo clippy --manifest-path engine/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - name: Strict Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings -D missing-docs
        run: cargo doc --manifest-path engine/Cargo.toml --locked --no-deps
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.9.3,<2"
          python -m pip install -r scripts/requirements-fixed-value-schema.txt
          python -m pip install --no-build-isolation --no-deps .
      - name: Python and artifact checks
        run: |
          python -m unittest discover -s tests -v
          python engine/test.py
          python agents/label_schema.py self-test
          python agents/label_schema.py validate agents/fixtures/label_rows.valid.jsonl docs/signature_target_exact_wave_47.jsonl docs/signature_target_mixed_hook_exact_wave_52.jsonl docs/signature_target_mixed_hook_exact_wave_55_rpf36.jsonl
          python scripts/validate_waves.py
          python scripts/validate_fixed_value_schemas.py
          python scripts/verify_release.py
